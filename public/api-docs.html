<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Anovra API Documentation</title>
    <link rel="preconnect" href="https://unpkg.com" />
    <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5.17.14/swagger-ui.css" />
    <style>
      :root {
        color-scheme: light;
        --anovra-green: #008236;
        --anovra-ink: #1f2a24;
        --anovra-muted: #66736b;
        --anovra-bg: #fbfaf7;
      }

      body {
        margin: 0;
        background: var(--anovra-bg);
        color: var(--anovra-ink);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .docs-shell {
        min-height: 100vh;
      }

      .docs-header {
        position: sticky;
        top: 0;
        z-index: 20;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        padding: 0.9rem clamp(1rem, 4vw, 2.5rem);
        background: rgba(251, 250, 247, 0.92);
        border-bottom: 1px solid rgba(31, 42, 36, 0.1);
        backdrop-filter: blur(14px);
      }

      .docs-brand {
        display: flex;
        align-items: center;
        gap: 0.85rem;
        min-width: 0;
      }

      .docs-brand img {
        height: 3rem;
        width: auto;
        object-fit: contain;
      }

      .docs-kicker {
        margin: 0;
        color: var(--anovra-muted);
        font-size: 0.7rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .docs-title {
        margin: 0.1rem 0 0;
        color: var(--anovra-ink);
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(1.1rem, 2vw, 1.45rem);
        font-weight: 400;
        line-height: 1.1;
      }

      .docs-back {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 2.5rem;
        padding: 0 1rem;
        border: 1px solid rgba(0, 130, 54, 0.25);
        border-radius: 0.75rem;
        background: #fff;
        color: var(--anovra-green);
        font-size: 0.85rem;
        font-weight: 700;
        text-decoration: none;
        white-space: nowrap;
      }

      #swagger-ui {
        max-width: 1180px;
        margin: 0 auto;
        padding: 1rem clamp(0.5rem, 2vw, 1.5rem) 3rem;
      }

      .swagger-ui .topbar {
        display: none;
      }

      .swagger-ui .info {
        margin: 1.5rem 0;
      }

      .swagger-ui .info .title {
        color: var(--anovra-ink);
        font-family: Georgia, "Times New Roman", serif;
        font-weight: 400;
      }

      .swagger-ui .btn.authorize,
      .swagger-ui .btn.execute {
        border-color: var(--anovra-green);
        background: var(--anovra-green);
        color: #fff;
        box-shadow: none;
      }

      .swagger-ui .opblock.opblock-get,
      .swagger-ui .opblock.opblock-post {
        border-color: rgba(0, 130, 54, 0.25);
        background: rgba(255, 255, 255, 0.88);
      }

      .swagger-ui .opblock.opblock-get .opblock-summary-method,
      .swagger-ui .opblock.opblock-post .opblock-summary-method {
        background: var(--anovra-green);
      }

      @media (max-width: 640px) {
        .docs-header {
          align-items: flex-start;
          flex-direction: column;
        }

        .docs-back {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <main class="docs-shell">
      <header class="docs-header">
        <div class="docs-brand">
          <img src="/logo.png" alt="Anovra" />
          <div>
            <p class="docs-kicker">Developer documentation</p>
            <h1 class="docs-title">Anovra Vendor API</h1>
          </div>
        </div>
        <a class="docs-back" href="/#/dashboard">Back to dashboard</a>
      </header>
      <div id="swagger-ui"></div>
    </main>
    <script src="https://unpkg.com/swagger-ui-dist@5.17.14/swagger-ui-bundle.js"></script>
    <script src="https://unpkg.com/swagger-ui-dist@5.17.14/swagger-ui-standalone-preset.js"></script>
    <script>
      window.ui = SwaggerUIBundle({
        url: "/openapi.json",
        dom_id: "#swagger-ui",
        deepLinking: true,
        persistAuthorization: true,
        displayRequestDuration: true,
        filter: true,
        tryItOutEnabled: true,
        presets: [SwaggerUIBundle.presets.apis, SwaggerUIStandalonePreset],
        layout: "StandaloneLayout"
      });
    </script>
  </body>
</html>
